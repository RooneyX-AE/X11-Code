name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, archive: zip }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release -p x11-cli --target "${{ matrix.target }}"

      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/x11" dist/x11
          tar -C dist -czf "x11-${{ matrix.target }}.tar.gz" x11

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/x11.exe" dist/x11.exe
          Compress-Archive -Path dist/x11.exe -DestinationPath "x11-${{ matrix.target }}.zip" -Force

      - name: Attest release artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: x11-${{ matrix.target }}.*

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: x11-${{ matrix.target }}
          path: x11-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: x11-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        shell: bash
        run: sha256sum x11-* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/x11-* dist/SHA256SUMS \
            --title "X11 Code ${GITHUB_REF_NAME}" \
            --generate-notes
