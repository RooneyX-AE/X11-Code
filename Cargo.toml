[workspace]
resolver = "2"
members = ["crates/x11-cli","crates/x11-core","crates/x11-agent","crates/x11-tools","crates/x11-context","crates/x11-model","crates/x11-session","crates/x11-permissions","crates/x11-protocol","crates/x11-mcp","crates/x11-plugin","crates/x11-tui","crates/x11-integration"]

[workspace.package]
version="0.1.0"
edition="2024"
license="MIT"
authors=["RooneyX-AE"]
repository="https://github.com/RooneyX-AE/X11-Code"

[workspace.dependencies]
anyhow="1"
async-trait="0.1"
clap={version="4.5",features=["derive"]}
crossterm="0.28"
reqwest={version="0.12",default-features=false,features=["json","rustls-tls"]}
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
thiserror="2"
tokio={version="1",features=["macros","rt-multi-thread","process","fs","io-util","sync","time"]}
tracing="0.1"
tracing-subscriber={version="0.3",features=["env-filter","fmt"]}
toml="0.8"
uuid={version="1",features=["v4","serde"]}
